# Fork note (gardenlinux fork, kvm-capi only, amd64 only):
# This flavors.yaml has been pruned to build/test/publish ONLY the kvm-capi
# flavor for amd64. All upstream flavors (aws, azure, gcp, baremetal,
# container, bare-*, ...) and the arm64 build have been removed, so every
# `gl-flavors-parse` matrix used by the GitHub workflows resolves to
# kvm-capi-amd64 only.
targets:
  - name: kvm
    category: hypervisor
    flavors:
      - features:
          - capi
        arch: amd64
        build: true
        test: true
        test-platform: false
        publish: true
