# Fork note (gardenlinux fork, kvm-capi only):
# Builds and tests kvm-capi on every push to main and on PRs. Additionally,
# on pushes to main the built images are published to the rolling
# 'dev-latest' GitHub prerelease (see publish_github_release job below).
# The workflow can also be started manually (workflow_dispatch); manual runs
# always build and test (detect_changes is bypassed) and optionally publish.
# PRs never publish. No external secrets are required.
name: dev
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-dev
  cancel-in-progress: true
on:
  push:
    branches:
      - main
    paths-ignore:
      - ".gitignore"
      - ".github/workflows/docs*.yml"
      - 'docs/**'
      - 'features/*/README.md'
      - 'features/*/info.yaml'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish build results to the dev-latest GitHub release'
        type: boolean
        default: true
  pull_request:
    # No paths-ignore on pull_request — workflow must run on every PR so that
    # build_and_test_gate always produces a check result for branch protection.
    # detect_changes skips the expensive build/test jobs on docs-only PRs.
jobs:
  detect_changes:
    name: Detect code path changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code || steps.manual.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
      - name: Check for code path changes
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # pin@v4.0.3
        with:
          filters: |
            code:
              - '!.gitignore'
              - '!.github/workflows/**'
              - '!docs/**'
              - '!features/*/README.md'
              - '!features/*/info.yaml'
              - '!CONTRIBUTING.md'
              - '!SECURITY.md'
      - name: Bypass change detection on manual dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        id: manual
        run: echo "code=true" >> "$GITHUB_OUTPUT"

  set_version:
    name: Set VERSION
    needs: detect_changes
    if: needs.detect_changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
      - name: Use VERSION file to support dev build on rel-branch
        id: version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
  build:
    needs: set_version
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.set_version.outputs.version }}
      fail_fast: false
    permissions:
      id-token: write # TODO: 3215 elevated permissions for included workflow
      actions: write  # TODO: 3215 elevated permissions for included workflow
      packages: write # TODO: 3215 elevated permissions for included workflow
  # Fork note (kvm-capi fork): generate the flavors matrix for the tests
  # directly instead of consuming needs.build.outputs.flavors_matrix.
  # Observed (2026-11-14): the nested workflow_call output
  # build.yml -> dev.yml silently evaluated to an EMPTY string even though
  # the identical value was non-empty INSIDE build.yml (the flavor build job
  # matrix expanded correctly). needs.<reusable-caller-job>.outputs/result
  # proved unreliable for us and for upstream (their "Build and test gate"
  # passed despite failed test jobs). Generating the matrix here via a
  # direct re-usable workflow call job uses the pattern that works.
  test_flavors_matrix:
    name: Generate flavors matrix for tests
    uses: ./.github/workflows/build_flavors_matrix.yml
    with:
      flags: --exclude "bare-*" --no-arch --json-by-arch --build --test

  # Fork note (kvm-capi fork): diagnostics helper — prints the outputs the
  # build workflow exposes so that empty-matrix wiring issues are visible
  # directly in the run log. Harmless; remove once the pipeline is stable.
  debug_build_outputs:
    name: Build outputs (diagnostics)
    needs: [build, test_flavors_matrix]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "build result:            ${{ needs.build.result }}"
          echo "flavors_matrix (nested): '${{ needs.build.outputs.flavors_matrix }}'"
          echo "flavors_matrix (direct): '${{ needs.test_flavors_matrix.outputs.matrix }}'"
          echo "version:                 '${{ needs.build.outputs.version }}'"

  test:
    needs: [build, test_flavors_matrix]
    if: ${{ success() || failure() }}
    name: Test
    uses: ./.github/workflows/tests.yml
    with:
      flavors_matrix: ${{ needs.test_flavors_matrix.outputs.matrix }}
      test_types: "chroot,qemu,oci,bare"
    permissions:
      id-token: write # TODO: 3215 elevated permissions for included workflow
      actions: write # TODO: 3215 elevated permissions for included workflow
      checks: write # Required for test_report job to write workflow summary

  build_and_test_gate:
    name: Build and test gate
    needs:
    - build
    - test
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Evaluate build and test result
        run: |
          CODE_CHANGED="${{ needs.detect_changes.outputs.code }}"

          if [[ "$CODE_CHANGED" != "true" ]]; then
            echo "No code paths changed; skipping build and test — gate passes."
            exit 0
          fi

          BUILD_RESULT="${{ needs.build.result }}"
          TEST_RESULT="${{ needs.test.result }}"

          if [[ "$BUILD_RESULT" != "success" ]]; then
            echo "Build result: $BUILD_RESULT"
            exit 1
          fi
          if [[ "$TEST_RESULT" != "success" ]]; then
            echo "Test result: $TEST_RESULT"
            exit 1
          fi

          echo "Build and test passed."

  publish_github_release:
    needs: [detect_changes, build, test, test_flavors_matrix]
    if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && needs.detect_changes.outputs.code == 'true' }}
    name: Publish to GitHub release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.test_flavors_matrix.outputs.matrix || '{"include":[]}') }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin@v8.0.1
        with:
          name: build-${{ matrix.cname }}-${{ matrix.arch }}
      - name: Upload to rolling GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: dev-latest
        run: |
          gh release create "$RELEASE_TAG" \
            --title "Garden Linux dev build (${{ needs.build.outputs.version }}, commit ${{ github.sha }})" \
            --target "${{ github.sha }}" \
            --prerelease || true

          for file in *.tar.gz; do
            gh release upload "$RELEASE_TAG" "$file" --clobber
          done
