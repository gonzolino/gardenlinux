name: test_report
on:
  workflow_call:
    inputs:
      test_jobs:
        description: "Comma-separated list of test job names to wait for"
        type: string
        required: true
jobs:
  flavor_version_data:
    name: Download flavor version data from trigger
    uses: ./.github/workflows/download_flavor_version_data.yml
    with:
      run_id: ${{ github.run_id }}
  test_report:
    name: Generate Test Report
    runs-on: ubuntu-24.04
    needs: [flavor_version_data]
    if: always()
    permissions:
      actions: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        with:
          submodules: true

      - name: Download all test artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin@v8.0.1
        with:
          pattern: "*-test-*"
          path: test-artifacts
          merge-multiple: true
        continue-on-error: true

      - name: List downloaded artifacts
        run: |
          # Fork note (kvm-capi fork): if no test job produced artifacts —
          # e.g. all of them were skipped or failed before uploading results
          # (their upload steps use if-no-files-found: ignore) — the download
          # step above (continue-on-error: true) never creates test-artifacts/
          # and a bare `find` would crash here with no useful error message.
          if [ ! -d test-artifacts ]; then
            mkdir -p test-artifacts
          fi
          echo "Downloaded test artifacts:"
          find test-artifacts -name "*.test.xml" -type f
          total=$(find test-artifacts -name "*.test.xml" -type f | wc -l)
          echo "Total XML files found: $total"
          if [[ "$total" -eq 0 ]]; then
            echo "::error::No test results were produced at all. Check the run graph:"
            echo "::error::were the 'Test chroot flavors' / 'Test QEMU flavors' jobs"
            echo "::error::skipped (determine step log shows 'disabled (0 flavors)')"
            echo "::error::or did they fail before uploading test artifacts?"
            exit 1
          fi

      - name: Set variables
        id: vars
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # pin@v9.0.0
        with:
          script: |
            const version = '${{ needs.flavor_version_data.outputs.version }}';
            const commitId = '${{ needs.flavor_version_data.outputs.commit_id }}';
            const commitShort = commitId.substring(0, 8);
            const commitUrl = `${{ github.server_url }}/${{ github.repository }}/commit/${commitId}`;
            const title = `Garden Linux ${version}-<a href="${commitUrl}">${commitShort}</a> Test Results`;

            core.setOutput('version', version);
            core.setOutput('commit_id', commitId);
            core.setOutput('commit_short', commitShort);
            core.setOutput('commit_url', commitUrl);
            core.setOutput('title', title);

      - name: Generate Test Report
        uses: gardenlinux/pytest-multi-results-action@8fc9cd734e3bfac0057ca43d70cd561b5f4d52bb
        if: always()
        with:
          files: |
            test-artifacts/**/*.test.xml
          title: ${{ steps.vars.outputs.title }}
          summary: true
          result-types: "skipped,passed,failed,error"
          fail-on-empty: false
          metadata-fields: "Artifact,Type,Namespace"
          metadata-field-mapping: '{"Namespace": "Namespace", "Type": "Type", "Artifact": "Artifact"}'

      - name: Upload report artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin@v7.0.1
        if: always()
        with:
          name: test-report
          path: |
            test-artifacts/*.test.xml
          retention-days: 30
